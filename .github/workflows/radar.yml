name: radar

on:
  schedule:
    # Her 15 dakikada bir (UTC). GitHub yoğunken birkaç dakika gecikebilir.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal, test = tüm kaynakları kontrol et ve rapor gönder, dry = mesaj gönderme"
        type: choice
        options: [test, run, dry]
        default: test

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          PRIVATE_SOURCES: ${{ secrets.PRIVATE_SOURCES }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: python -m radar --mode "${{ inputs.mode || 'run' }}"

      - name: Save state
        if: ${{ (inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -q -m "state update [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 5
          done
          echo "push failed" && exit 1
