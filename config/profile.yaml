# Filtre ayarları
# Bu dosya public repoda görünür. Gizli kalmasını istediğin bir şey varsa
# aynı formatta GitHub Secret olarak PROFILE_YAML adıyla ekle, bu dosyanın üstüne yazılır.
# CV buraya YAZILMAZ, CV_TEXT secret'ına girer.

# ---- Kişisel ayarlar ----
min_hourly_usd: 12.5        # Saatlik ücret yazan ve bunun altında kalan ilanlar elenir. null = kapalı
min_score: 60               # Yapay zeka puanı (0-100) bu sayının altındaysa bildirim gelmez
hot_min_score: 35           # Türkçe ilanlar için daha düşük eşik (örneğin Türkiye'deki kodlama işleri elensin)
languages: [Turkish, English]
interests: |
  Turkish language and localization work, Turkish-English review.
  RLHF, SFT, preference ranking, side by side comparison, golden response writing.
  AI output evaluation, quality auditing, QA and reviewer roles, rubric design.
  Factuality and safety evaluation, red teaming, adversarial testing.
  Tool use, function calling, agent and computer use evaluation, spreadsheet tasks.
  Generalist AI trainer roles. Psychology or behavioral science roles are a plus.
  Human data ops or team lead roles in AI training are welcome.
avoid: |
  Medicine, healthcare, clinical, pharma or law and legal roles.
  Jobs limited to US residents or other specific countries that exclude Turkey.
  Fully on site or in person jobs.
  Roles that need a PhD, a medical or law licence, or a specific STEM degree.

# ---- Kelime filtresi (yapay zekadan önce çalışır, ücretsiz) ----

# Başlıkta veya konumda geçerse her zaman bildirilir
always_include: [turkish, türkçe, turkey, türkiye, istanbul]

# İlgi kelimeleri. Yapay zeka kapalıyken sadece bunlardan biri geçen ilanlar gelir.
# AI lab kaynaklarında (require_include) başlıkta bunlardan biri olmak zorunda.
include:
  - ai trainer
  - ai tutor
  - trainer
  - tutor
  - annotat
  - labeler
  - labeling
  - rater
  - evaluator
  - evaluation
  - rlhf
  - prompt
  - red team
  - linguist
  - language specialist
  - language expert
  - native
  - localization
  - translator
  - transcri
  - writer
  - reviewer
  - quality analyst
  - human data
  - generalist
  - freelance
  - contractor

# Başlıkta geçerse direkt elenir
exclude_title:
  - account executive
  - sales
  - recruiter
  - talent acquisition
  - marketing
  - accountant
  - finance manager
  - payroll
  - legal counsel
  - attorney
  - executive assistant
  - office manager
  - vice president
  - head of
  - director
  - physician
  - nurse
  - doctor
  - medical
  - medicine
  - clinical
  - clinician
  - healthcare
  - health care
  - pharma
  - dentist
  - radiolog
  - surgeon
  - legal
  - lawyer
  - paralegal
  - law expert
  - law specialist
  - juris
  - in-person
  - in person

location:
  # Konumda veya açıklamanın başında geçerse elenir
  block:
    - us only
    - u.s. only
    - usa only
    - united states only
    - us residents only
    - must reside in the us
    - must reside in the united states
    - must be located in the us
    - must be based in the us
    - canada only
    - uk only
    - onsite only
    - on-site only
    - in-person study
    - us citizens
    - us work authorization
    - authorized to work in the united states
    - authorized to work in the us
  # Konum sadece bunlardan biriyse ve listede Türkiye/Avrupa/global yoksa elenir (tam kelime eşleşir)
  block_places:
    - us
    - usa
    - u.s.
    - united states
    - canada
    - united kingdom
    - uk
    - australia
    - india
    - philippines
    - new york
    - nyc
    - san francisco
    - california
    - texas
    - seattle
    - london
  allowed_only_if_remote: true
  onsite_words: [on-site, onsite, in office, in-office, hybrid]
  remote_words: [remote, anywhere, worldwide, global]
  ok_places: [turkey, türkiye, istanbul, emea, europe, worldwide, anywhere, global]

skip_reposts: false   # true yaparsan son 30 günde aynı başlıkla açılmış ilanlar gelmez

rules:
  max_age_days: 10            # yayın tarihi bundan eskiyse bildirme (tarih veren kaynaklarda)
  max_messages_per_run: 12    # fazlası tek bir liste mesajında gelir
  max_page_fetches: 25        # her turda en fazla kaç ilan sayfası açılsın
  daily_report_hour: 10       # Türkiye saatiyle günlük durum mesajı
  alert_after_failures: 16    # bir kaynak bu kadar tur üst üste bozulursa (yaklaşık 4 saat) haber ver
  reset_min_new: 40           # bir kaynakta bir anda bu kadar yeni ilan çıkarsa site değişmiş say
  repost_window_days: 30
  forget_after_days: 60
  llm_desc_chars: 1500
